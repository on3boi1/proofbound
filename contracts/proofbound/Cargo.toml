[package]
name = "proofbound"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.2", features = ["legacy"] }
near-contract-standards = "=5.30.2"

[dev-dependencies]
near-sdk = { version = "=5.30.2", features = ["legacy", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
strip = true
